# Fashion-O-Mat-Start
- type: entity
  name: sweet pastry set bag
  parent: ClothingBackpackDuffel
  id: BoxPancakes
  description: Look like someone who cares more about pancakes than what others think of her. Look like-A ROBOT??!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingHeadHoney
        - id: ClothingUniformPastryDress
        - id: ClothingUniformApron
        - id: FoodBakedPancake
          amount: 2

- type: entity
  parent: ClothingBackpackTrunkSpaceCourier
  id: BoxCourier
  name: space courier trunk
  suffix: Bundle
  description: A stylish green costume bundle themed after a legendary space courier. Ranked 9/13 on popular review websites!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingEyesSpaceCourierGoggles
        - id: ClothingUniformJumpsuitSpaceCourier
        - id: ClothingHandsGlovesColorBlack
        - id: ClothingOuterCoatSpaceCourier
        - id: ClothingShoesBootsSpaceCourier

- type: entity
  parent: ClothingBackpackTrunkSpaceCourierPAI
  id: BoxCourierPAI
  name: space courier trunk
  suffix: Bundle, Ghost Role
  description: A stylish green costume bundle themed after a legendary space courier. Ranked 9/13 on popular review websites!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingEyesSpaceCourierGoggles
        - id: ClothingUniformJumpsuitSpaceCourier
        - id: ClothingHandsGlovesColorBlack
        - id: ClothingOuterCoatSpaceCourier
        - id: ClothingShoesBootsSpaceCourier
