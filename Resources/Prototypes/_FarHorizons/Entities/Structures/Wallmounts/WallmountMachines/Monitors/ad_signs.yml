- type: entity
  id: BaseAdSign
  parent: BaseBarSign
  name: ad sign
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: television_wall_off
  - type: BarSign
    emped: EmpBarSign
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

#region ## NanoTrasen ##
- type: entity
  parent: BaseAdSign
  id: AdSignCWS
  name: Clockwork Solutions
  description: Just a simple sign displaying an ad for Clockwork Solutions trying to look tough.
  suffix: CWS, NT
  components:
  - type: BarSign
    current: CWSSign

- type: barSign
  id: CWSSign
  name: barsign-prototype-name-cwc-screen
  icon:
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: CWSscreen
  description: barsign-prototype-description-cwc-screen

- type: entity
  parent: BaseAdSign
  id: AdSignSec
  name: NT Corporate Security
  description: A ad sign attempting to repair security's reputation.
  suffix: Sec, NT
  components:
  - type: BarSign
    current: SecSign

- type: barSign
  id: SecSign
  name: barsign-prototype-name-sec-screen
  icon:
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: Secpropa
  description: barsign-prototype-description-sec-screen

- type: entity
  parent: WallmountTelevision
  id: WallmountTelevisionGensys
  suffix: Gensys, NT
  components:
  - type: Sprite
    layers:
      - map: ["computerLayerBody"]
        state: television_wall
      - map: ["computerLayerScreen"]
        state: Gensys
  - type: PointLight
    enabled: true
    energy: 2
    radius: 2.5
    offset: 0.0, -.75
    color: "#f7ba00"

