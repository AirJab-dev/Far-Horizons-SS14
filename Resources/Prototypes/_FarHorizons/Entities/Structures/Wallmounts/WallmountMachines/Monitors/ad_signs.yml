- type: entity
  id: BaseAdSign
  parent: BaseBarSign
  name: ad sign
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: empty
  - type: BarSign
    emped: EmpedSign
    titleName: adsign-ui-menu
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak

#region Generics
- type: barSign
  id: EmpedSign
  name: barsign-prototype-name-emped-screen
  icon:
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: television_wall
  description: barsign-prototype-description-emped-screen
  hidden: true
  signType: AdSignGeneric
          
