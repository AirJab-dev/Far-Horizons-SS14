#region WallSolid

- type: entity
  parent: WallSolid
  id: WallSolidGeneric
  suffix: Generic
  name: Solid Wall
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/Generic/solid.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/Generic/solid.rsi

- type: entity
  parent: WallSolid
  id: WallSolidNS
  name: Solid Wall
  suffix: NS
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/NeoSol/solid.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/NeoSol/solid.rsi

- type: entity
  parent: WallSolidGeneric
  id: WallSolidRustGeneric
  suffix: Rusted, Generic
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/Generic/solid_rust.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/Generic/solid_rust.rsi
    state: full
  - type: Construction
    graph: Girder
    node: wallrust

- type: entity
  parent: WallSolidNS
  id: WallSolidRustNS
  suffix: Rusted, NS
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/NeoSol/solid_rust.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/NeoSol/solid_rust.rsi
    state: full
  - type: Construction
    graph: Girder
    node: wallrust

- type: entity
  parent: WallSolid
  id: WallFakeNT
  name: Solid Wall
  suffix: Fake, NT
  description: This wall feels.. hollow. Some signage reads "Break in event of Emergency!"
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # ~12 hits with a standard toolbox, which I feel is fair
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam

- type: entity
  parent: WallSolidNS
  id: WallFakeNS
  name: Solid Wall
  suffix: Fake, NS
  description: This wall feels.. hollow. Some signage reads "Break in event of Emergency!"
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # ~12 hits with a standard toolbox, which I feel is fair
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam

#region WallReinforced
- type: entity
  parent: WallReinforced
  id: WallReinforcedGeneric
  name: Reinforced Wall
  suffix: Generic
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/Generic/solid.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/Generic/solid.rsi
    state: rgeneric
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}

- type: entity
  parent: WallReinforced
  id: WallReinforcedNS
  name: Reinforced Wall
  suffix: NS
  components:
